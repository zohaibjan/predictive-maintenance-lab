services:
  kafka:
    image: apache/kafka:4.0.2
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
  init-topic:
    image: apache/kafka:4.0.2
    depends_on:
      kafka: {condition: service_healthy}
    command: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic sensor-readings --partitions 3 --replication-factor 1
  train:
    build: .
    volumes: ["./runtime:/app/runtime"]
    command: python -m maintenance.train --tracking-uri sqlite:///runtime/mlflow.db
  api:
    build: .
    volumes: ["./runtime:/app/runtime"]
    ports: ["127.0.0.1:8000:8000"]
    command: uvicorn maintenance.api:app --host 0.0.0.0 --port 8000
  consumer:
    build: .
    volumes: ["./runtime:/app/runtime"]
    environment: {KAFKA_BOOTSTRAP: "kafka:29092"}
    depends_on:
      init-topic: {condition: service_completed_successfully}
    command: python -m maintenance.stream consume
  producer:
    build: .
    environment: {KAFKA_BOOTSTRAP: "kafka:29092"}
    depends_on:
      init-topic: {condition: service_completed_successfully}
    command: python -m maintenance.stream produce
